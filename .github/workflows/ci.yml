# The four checks AGENTS.md requires before work is done, on every push and
# every PR into main. Secret-free by design — see DECISIONS.md § 2026-10-01
# "CI on GitHub Actions".
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_MOCK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      # Node 24 ships npm 11, the npm that writes package-lock.json locally;
      # npm 10 (Node 22) rejects the same lockfile.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PageProps / LayoutProps are generated by Next, not committed.
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
